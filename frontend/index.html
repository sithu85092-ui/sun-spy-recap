<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SUN SPY RECAP</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="app">

        <header class="header">

            <div class="brand">
                <span class="logo">☀️</span>

                <div>
                    <h1>SUN SPY RECAP</h1>
                    <p>Upload • Discover • Recap</p>
                </div>
            </div>

        </header>


        <section class="hero">

            <h2>
                Turn your videos into
                <span>short recaps.</span>
            </h2>

            <p>
                Upload a video and let SUN SPY RECAP
                discover the most interesting moments.
            </p>

        </section>


        <section class="upload-card">

            <div
                id="dropZone"
                class="drop-zone"
            >

                <div class="upload-icon">
                    🎬
                </div>

                <h3>
                    Drop your video here
                </h3>

                <p>
                    or select a video from your device
                </p>

                <button
                    id="selectButton"
                    type="button"
                >
                    Select Video
                </button>

                <input
                    id="videoInput"
                    type="file"
                    accept="video/*"
                    hidden
                >

            </div>


            <div
                id="fileInfo"
                class="file-info hidden"
            ></div>


            <div
                id="progressContainer"
                class="progress-container hidden"
            >

                <div class="progress-header">
                    <span id="progressText">
                        Uploading...
                    </span>

                    <span id="progressPercent">
                        0%
                    </span>
                </div>

                <div class="progress-bar">
                    <div
                        id="progressBar"
                        class="progress"
                    ></div>
                </div>

            </div>


            <div
                id="statusBox"
                class="status-box hidden"
            ></div>

        </section>


        <section
            id="resultSection"
            class="result-section hidden"
        >

            <h2>
                Your Recap
            </h2>

            <video
                id="resultVideo"
                controls
                playsinline
            ></video>

        </section>


        <footer>

            <p>
                © 2026 SUN SPY RECAP
            </p>

        </footer>

    </main>


    <script src="app.js"></script>

</body>
</html>
