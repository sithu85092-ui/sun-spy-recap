services:
  - type: web
    name: sun-spy-recap
    runtime: python
    plan: free

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      sh -c "python -m backend.worker & exec uvicorn backend.main:app --host 0.0.0.0 --port \$PORT"

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: DATABASE_URL
        sync: false
